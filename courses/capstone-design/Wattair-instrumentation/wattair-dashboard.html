<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wattair AWG — Instrumentation Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;
  --surface:#0d1420;
  --surface2:#111827;
  --border:#1e2d3d;
  --blue:#38bdf8;
  --blue-dim:#0a1e35;
  --blue-text:#7dd3fc;
  --orange:#f97316;
  --orange-dim:#271200;
  --orange-text:#fdba74;
  --green:#4ade80;
  --green-dim:#0d2010;
  --red:#f87171;
  --purple:#a855f7;
  --cyan:#22d3ee;
  --amber:#fbbf24;
  --text:#e2e8f0;
  --text-muted:#64748b;
  --text-dim:#475569;
  --sidebar-w:220px;
  --topbar-h:56px;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;
  display:flex;
  flex-direction:column;
}

/* ── TOP BAR ── */
#topbar{
  height:var(--topbar-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:16px;
  flex-shrink:0;
  z-index:10;
}
#topbar .logo{
  font-size:18px;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--blue);
}
#topbar .logo span{color:var(--text-muted)}
#topbar .tagline{font-size:12px;color:var(--text-muted);margin-left:4px}

/* system-wide status pill */
#sys-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}
.status-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 14px;
  border-radius:99px;
  font-size:12px;
  font-weight:600;
  border:1px solid;
  transition:all .3s;
}
.status-pill .dot{
  width:8px;height:8px;
  border-radius:50%;
  animation:pulse-dot 1.8s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

.pill-idle    {background:#0d1420;border-color:#1e2d3d;color:#64748b}
.pill-idle .dot{background:#475569;animation:none}
.pill-adsorb  {background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.pill-adsorb .dot{background:var(--blue)}
.pill-isolate {background:var(--purple-dim,#1a0a2e);border-color:var(--purple);color:var(--purple)}
.pill-isolate .dot{background:var(--purple)}
.pill-desorb  {background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.pill-desorb .dot{background:var(--orange)}
.pill-condense{background:var(--cyan-dim,#021c22);border-color:var(--cyan);color:var(--cyan)}
.pill-condense .dot{background:var(--cyan)}
.pill-ready   {background:var(--green-dim);border-color:var(--green);color:var(--green)}
.pill-ready .dot{background:var(--green)}
.pill-fault   {background:var(--red-dim,#1a0808);border-color:var(--red);color:var(--red)}
.pill-fault .dot{background:var(--red)}

#clock-display{font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums}

/* ── LAYOUT ── */
#layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar-w);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:12px 0;
  flex-shrink:0;
  overflow-y:auto;
}
.nav-section-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-dim);
  padding:8px 18px 4px;
  margin-top:4px;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 18px;
  cursor:pointer;
  color:var(--text-muted);
  font-size:13px;
  font-weight:500;
  border-left:3px solid transparent;
  transition:all .15s;
  user-select:none;
}
.nav-item:hover{background:rgba(56,189,248,.06);color:var(--text)}
.nav-item.active{
  background:rgba(56,189,248,.1);
  color:var(--blue);
  border-left-color:var(--blue);
}
.nav-item .nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nav-item .nav-badge{
  margin-left:auto;
  font-size:10px;
  padding:2px 7px;
  border-radius:99px;
  background:var(--blue-dim);
  color:var(--blue);
  font-weight:600;
}
.nav-divider{height:1px;background:var(--border);margin:8px 14px}

/* ── CONTENT FRAME ── */
#content{
  flex:1;
  overflow:hidden;
  position:relative;
}
#page-frame{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* ── FAULT BANNER ── */
#fault-banner{
  display:none;
  position:absolute;
  top:0;left:0;right:0;
  background:var(--red-dim,#1a0808);
  border-bottom:1px solid var(--red);
  color:var(--red);
  font-size:13px;
  font-weight:600;
  padding:8px 18px;
  z-index:20;
  animation:flash-red .8s ease-in-out infinite alternate;
}
@keyframes flash-red{from{opacity:1}to{opacity:.6}}
#fault-banner.show{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">Wattair <span>AWG</span></div>
  <div class="tagline">Instrumentation &amp; Control Dashboard</div>
  <div id="sys-status">
    <div id="clock-display">--:--:--</div>
    <div class="status-pill pill-idle" id="status-pill">
      <div class="dot"></div>
      <span id="status-label">Idle</span>
    </div>
  </div>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="nav-section-label">Overview</div>
    <div class="nav-item active" data-page="page-home.html">
      <span class="nav-icon">⬡</span> Home
    </div>

    <div class="nav-section-label">Cycle Stages</div>
    <div class="nav-item" data-page="page-adsorption.html">
      <span class="nav-icon">💧</span> Adsorption
    </div>
    <div class="nav-item" data-page="page-desorption.html">
      <span class="nav-icon">🔥</span> Desorption
    </div>
    <div class="nav-item" data-page="page-condensation.html">
      <span class="nav-icon">❄</span> Condensation
    </div>

    <div class="nav-divider"></div>
    <div class="nav-section-label">System</div>
    <div class="nav-item" data-page="page-settings.html">
      <span class="nav-icon">⚙</span> Settings
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div id="content">
    <div id="fault-banner" class="show" style="display:none">
      ⚠ FAULT DETECTED — Check fault log on Settings page
    </div>
    <iframe id="page-frame" src="page-home.html" title="Dashboard Page"></iframe>
  </div>

</div>

<script>
// ── NAVIGATION ──
const items = document.querySelectorAll('.nav-item');
const frame = document.getElementById('page-frame');

items.forEach(item => {
  item.addEventListener('click', () => {
    items.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    frame.src = item.dataset.page;
  });
});

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock-display').textContent =
    now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── SHARED STATE (broadcast to child pages via postMessage) ──
// Child pages can call window.parent.setSystemState(state) to update the top bar.
const STATE_MAP = {
  idle:     { cls:'pill-idle',     label:'Idle'         },
  adsorb:   { cls:'pill-adsorb',   label:'Adsorption'   },
  isolate:  { cls:'pill-isolate',  label:'Isolation'    },
  desorb:   { cls:'pill-desorb',   label:'Desorption'   },
  condense: { cls:'pill-condense', label:'Condensation' },
  ready:    { cls:'pill-ready',    label:'Cycle Ready'  },
  fault:    { cls:'pill-fault',    label:'FAULT'        },
};

window.setSystemState = function(state) {
  const pill   = document.getElementById('status-pill');
  const label  = document.getElementById('status-label');
  const banner = document.getElementById('fault-banner');
  const map    = STATE_MAP[state] || STATE_MAP.idle;

  pill.className = 'status-pill ' + map.cls;
  label.textContent = map.label;

  banner.style.display = (state === 'fault') ? 'flex' : 'none';
};

// Navigate to a page by name — callable from child frames
window.navigateTo = function(page) {
  items.forEach(i => i.classList.remove('active'));
  const target = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (target) target.classList.add('active');
  frame.src = page;
};
</script>
</body>
</html>
