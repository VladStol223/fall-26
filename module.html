<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Guide</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <!-- MathJax v3: renders \(...\) inline and \[...\] display math in learn section bodies -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)']],
        displayMath: [['\\[','\\]']],
        tags: 'none'
      },
      svg: { fontCache: 'global', scale: 1.05 },
      options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','mark'],
        processHtmlClass: 'math-content'
      },
      startup: { typeset: false }   // we trigger typesetting manually per-section
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background-color: #f7f8fa;
      color: #1f2328;
      line-height: 1.6;
      padding: 72px 20px 20px; /* top clears the fixed 36px toggle + 16px offset + gap */
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: visible;
      transition: max-width .3s ease;
    }
    /* when reading panel is open, widen the whole container */
    body.reading-open .container { max-width: 1400px; }

    /* ── Learn split layout ── */
    .learn-split {
      display: flex; gap: 0; align-items: flex-start;
    }
    .learn-main {
      flex: 1 1 0; min-width: 0;
    }
    /* reading panel — hidden by default, slides in from right */
    .reading-panel {
      flex: 0 0 0; width: 0; overflow: hidden;
      border-left: 0px solid #e5e7eb;
      transition: flex-basis .3s ease, width .3s ease, border-width .1s ease .2s;
      position: relative;
    }
    body.reading-open .reading-panel {
      flex: 0 0 480px; width: 480px;
      border-left-width: 1px;
      border-left-color: #e5e7eb;
      transition: flex-basis .3s ease, width .3s ease, border-width 0s;
    }
    .reading-panel-inner {
      width: 480px; padding: 0 24px 24px;
      overflow-y: auto;
      max-height: calc(100vh - 130px);
      position: sticky; top: 72px;
    }
    .reading-panel-header {
      position: sticky; top: 0; z-index: 2;
      background: white; padding: 16px 0 12px;
      border-bottom: 1px solid #e5e7eb; margin-bottom: 16px;
    }
    .reading-panel-title {
      font-size: 13px; font-weight: 700; color: #0a3c78;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .reading-panel-source {
      font-size: 11px; color: #57606a; margin-top: 3px;
    }

    /* reading paragraphs */
    .reading-para {
      font-size: 13.5px; line-height: 1.75; color: #1f2328;
      margin-bottom: 14px; padding: 8px 10px; border-radius: 5px;
      border-left: 3px solid transparent;
      transition: background .2s, border-color .2s, opacity .2s;
    }
    /* when any section is active, dim non-matching paragraphs */
    .reading-panel.has-active .reading-para { opacity: .3; }
    .reading-panel.has-active .reading-para.reading-para-active {
      opacity: 1;
      background: #eff6ff;
      border-left-color: #3b82d4;
    }
    /* first active para gets a scroll target marker */
    .reading-para-active-first { scroll-margin-top: 80px; }

    /* toggle button in the banner */
    #reading-toggle-btn {
      flex-shrink: 0; padding: 6px 12px;
      background: white; border: 1px solid #d1d5db; border-radius: 5px;
      font-size: 13px; font-weight: 500; color: #57606a; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    #reading-toggle-btn:hover { background: #eff6ff; border-color: #3b82d4; color: #0a3c78; }
    #reading-toggle-btn.active { background: #eff6ff; border-color: #3b82d4; color: #0a3c78; }

    /* mobile: reading panel becomes a fixed bottom drawer */
    @media (max-width: 900px) {
      body.reading-open .container { max-width: 760px; }
      .learn-split { flex-direction: column; }
      .reading-panel {
        flex: none !important; width: 100% !important;
        border-left: none !important;
        border-top: 1px solid #e5e7eb;
        max-height: 0; overflow: hidden;
        transition: max-height .35s ease;
      }
      body.reading-open .reading-panel { max-height: 60vh; }
      .reading-panel-inner {
        width: 100%; max-height: 60vh; padding: 0 16px 16px;
        position: static;
      }
    }

    .header {
      background: linear-gradient(135deg, #0a3c78 0%, #1e64b4 100%);
      color: white;
      padding: 30px;
      text-align: center;
      border-bottom: 4px solid #3b82d4;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; font-weight: 600; }
    .header p  { font-size: 14px; opacity: .95; }

    /* ── Nav tabs ── */
    .nav-tabs { display: flex; border-bottom: 1px solid #e5e7eb; background: #f7f8fa; flex-wrap: wrap; }
    .nav-tabs button {
      flex: 1; min-width: 120px; padding: 14px 16px; border: none;
      background: none; font-size: 14px; font-weight: 500; color: #57606a;
      cursor: pointer; transition: all .3s; border-bottom: 3px solid transparent;
    }
    .nav-tabs button.active  { color: #0a3c78; border-bottom-color: #0a3c78; background: white; }
    .nav-tabs button:hover   { background: white; color: #0a3c78; }

    .content { padding: 30px; overflow: hidden; border-radius: 0 0 8px 8px; }
    /* When reading is open, don't clip the right side so the panel can stretch */
    body.reading-open .content { overflow: visible; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

    /* ── Overview ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-box  { background: #f0f4ff; border: 1px solid #dbeafe; border-radius: 8px; padding: 16px; text-align: center; }
    .stat-number { font-size: 26px; font-weight: 700; color: #0a3c78; }
    .stat-label  { font-size: 11px; color: #57606a; margin-top: 4px; text-transform: uppercase; letter-spacing: .4px; }

    .cheat-section { margin-bottom: 28px; }
    .cheat-section h3 { font-size: 15px; font-weight: 700; color: #0a3c78; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #e5e7eb; }

    .cheat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 10px; }
    .cheat-item { background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; }
    .cheat-item-name { font-size: 13px; font-weight: 600; color: #0a3c78; margin-bottom: 4px; }
    .cheat-item-desc { font-size: 12px; color: #57606a; line-height: 1.4; }

    .cheat-dates, .cheat-terms { display: flex; flex-direction: column; gap: 6px; }
    .cheat-date-row, .cheat-term-row {
      display: flex; gap: 12px; padding: 8px 10px;
      background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 13px;
    }
    .cheat-date-year { font-weight: 700; color: #0a3c78; min-width: 96px; flex-shrink: 0; }
    .cheat-date-event { color: #1f2328; }
    .cheat-term-name  { font-weight: 700; color: #0a3c78; min-width: 140px; flex-shrink: 0; }
    .cheat-term-def   { color: #1f2328; }

    /* ── Learn ── */
    .learn-section { margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
    .learn-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #f7f8fa; cursor: pointer;
      font-size: 14px; font-weight: 600; color: #1f2328;
      transition: background .2s;
    }
    .learn-section-header:hover { background: #eef2ff; }
    .learn-section-header.open  { background: #eef2ff; border-bottom: 1px solid #e5e7eb; }
    .learn-chevron { font-size: 11px; color: #57606a; transition: transform .22s; }
    .learn-section-header.open .learn-chevron { transform: rotate(180deg); }
    .tts-btn {
      background: none; border: 1px solid #d1d5db; border-radius: 4px;
      padding: 2px 7px; font-size: 13px; cursor: pointer; color: #57606a;
      transition: background .15s, border-color .15s;
    }
    .tts-btn:hover, .tts-btn.tts-active  { background: #dbeafe; border-color: #3b82d4; }
    .tts-btn.tts-paused { background: #fef9c3; border-color: #d97706; }

    /* narrator position cursor */
    .tts-cursor {
      background: #bfdbfe; border-radius: 2px; padding: 0 1px;
      outline: 2px solid #3b82d4; outline-offset: 1px;
      transition: background .1s;
    }

    .learn-section-body {
      display: none; padding: 16px 16px 20px; font-size: 14px; line-height: 1.75; color: #1f2328;
    }
    .learn-section-body.open { display: block; }
    .learn-section-body p    { margin-bottom: 10px; }
    .learn-section-body p:last-child { margin-bottom: 0; }
    .learn-section-body ol, .learn-section-body ul { padding-left: 22px; margin-top: 8px; }
    .learn-section-body li   { margin-bottom: 6px; }
    mark { background: #fef9c3; padding: 1px 3px; border-radius: 2px; }

    /* ── Math formula display blocks ── */
    .math-block {
      background: #f0f4f8; border-left: 3px solid #3b82d4;
      padding: 10px 16px; margin: 10px 0; border-radius: 0 4px 4px 0;
      overflow-x: auto; text-align: center;
    }
    /* MathJax SVG sizing */
    .math-block mjx-container { display: block; margin: 4px auto; }
    .learn-section-body mjx-container[jax="SVG"] { vertical-align: middle; }

    /* ── Anki ── */
    .anki-container { display: flex; flex-direction: column; gap: 20px; }
    .anki-instructions {
      background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 14px; font-size: 13px; color: #57606a;
    }
    .anki-instructions strong { color: #0a3c78; }
    .anki-instructions-action { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .action-left, .action-right {
      flex: 1; background: white; border: 1px solid #e5e7eb; border-radius: 5px;
      padding: 10px 12px; font-size: 12px; color: #57606a; min-width: 160px;
    }
    .action-label {
      display: inline-block; background: #0a3c78; color: white;
      font-size: 10px; font-weight: 700; letter-spacing: .5px;
      padding: 2px 6px; border-radius: 3px; margin-bottom: 4px;
    }

    .anki-card-content {
      position: relative; overflow: hidden;
      padding: 20px; border-radius: 6px; background: white; border: 2px solid #e5e7eb;
      min-height: 250px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 20px; margin: 20px 0; cursor: pointer;
      transition: border-color .2s, background .2s, box-shadow .2s;
      user-select: none; -webkit-user-select: none;
      will-change: transform, opacity;
    }
    .anki-card-content:hover { box-shadow: 0 4px 12px rgba(59,130,212,.15); border-color: #3b82d4; }

    /* left/right zone hints shown on the back of the card */
    .anki-card-content.anki-back::before,
    .anki-card-content.anki-back::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 50%;
      opacity: 0; transition: opacity .15s;
      pointer-events: none;
    }
    .anki-card-content.anki-back::before { left: 0;   background: linear-gradient(to right, rgba(220,38,38,.06), transparent); border-right: 1px dashed rgba(220,38,38,.15); }
    .anki-card-content.anki-back::after  { right: 0;  background: linear-gradient(to left, rgba(22,163,74,.06), transparent); }
    .anki-card-content.anki-back:hover::before,
    .anki-card-content.anki-back:hover::after { opacity: 1; }

    /* zone label overlays */
    .anki-zone-again, .anki-zone-good {
      position: absolute; top: 8px; font-size: 11px; font-weight: 600;
      letter-spacing: .4px; text-transform: uppercase; opacity: 0;
      transition: opacity .15s; pointer-events: none;
    }
    .anki-zone-again { left: 10px;  color: rgba(220,38,38,.45); }
    .anki-zone-good  { right: 10px; color: rgba(22,163,74,.45); }
    .anki-card-content.anki-back:hover .anki-zone-again,
    .anki-card-content.anki-back:hover .anki-zone-good { opacity: 1; }

    /* swipe feedback flashes */
    .anki-card-content.flash-good  { border-color: #16a34a !important; background: #f0fdf4 !important; }
    .anki-card-content.flash-again { border-color: #dc2626 !important; background: #fef2f2 !important; }

    /* card animations */
    @keyframes anki-flip {
      0%   { transform: rotateY(0deg)   scaleX(1);    opacity: 1; }
      40%  { transform: rotateY(6deg)   scaleX(.97);  opacity: .85; }
      100% { transform: rotateY(0deg)   scaleX(1);    opacity: 1; }
    }
    @keyframes anki-exit-left {
      0%   { transform: translateX(0);    opacity: 1; }
      100% { transform: translateX(-28px); opacity: 0; }
    }
    @keyframes anki-exit-right {
      0%   { transform: translateX(0);    opacity: 1; }
      100% { transform: translateX(28px); opacity: 0; }
    }
    @keyframes anki-enter {
      0%   { transform: scale(.97); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .anki-card-content.anim-flip       { animation: anki-flip       .22s ease both; }
    .anki-card-content.anim-exit-left  { animation: anki-exit-left  .18s ease both; pointer-events: none; }
    .anki-card-content.anim-exit-right { animation: anki-exit-right .18s ease both; pointer-events: none; }
    .anki-card-content.anim-enter      { animation: anki-enter      .18s ease both; }

    /* ── Concentric rings progress ── */
    .anki-rings-wrap {
      display: flex; align-items: center; justify-content: center; gap: 24px; margin: 20px 0;
      background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 20px;
    }
    .anki-rings-svg { flex-shrink: 0; }
    .anki-rings-legend { display: flex; flex-direction: column; gap: 10px; min-width: 130px; }
    .anki-rings-legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1f2328; }
    .anki-rings-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .anki-rings-legend-val { font-weight: 700; margin-left: auto; padding-left: 12px; }
    @media (max-width: 520px) {
      .anki-rings-wrap { flex-direction: column; align-items: center; gap: 16px; }
      .anki-rings-legend { flex-direction: row; flex-wrap: wrap; justify-content: center; min-width: unset; gap: 8px 20px; }
      .anki-rings-legend-val { padding-left: 6px; }
    }

    .anki-stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin: 16px 0 0; }
    .anki-stat      { background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; text-align: center; }
    .anki-stat-key  { background: #fffbeb; border-color: #fde68a; }
    .anki-stat-key .anki-stat-value { color: #b45309; }
    .anki-stat-key .anki-stat-label { color: #92400e; }
    .anki-stat-value { font-size: 20px; font-weight: 600; color: #0a3c78; }
    .anki-stat-label { font-size: 11px; color: #57606a; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

    /* mobile swipe hint */
    .anki-swipe-hint {
      display: none; text-align: center; font-size: 12px; color: #57606a;
      margin: -12px 0 8px; gap: 16px; justify-content: center;
    }
    @media (hover: none) {
      .anki-instructions { display: none; }
      .anki-swipe-hint   { display: flex; }
      .anki-card-content { font-size: 18px; min-height: 220px; }
    }

    .anki-btn         { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
    .anki-btn-primary { background: #0a3c78; color: white; }
    .anki-btn-primary:hover { background: #1e64b4; }
    .anki-btn-secondary { background: #e5e7eb; color: #1f2328; }
    .anki-btn-secondary:hover { background: #d1d5db; }

    .session-complete h3 { color: #15803d; margin-top: 0; }
    .session-complete p  { font-size: 14px; color: #57606a; margin-top: 6px; }

    .footer { padding: 16px 24px; text-align: center; font-size: 12px; color: #57606a; border-top: 1px solid #e5e7eb; }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; width: 260px;
      background: #0a2342; color: #e2e8f0; z-index: 1000;
      display: flex; flex-direction: column;
      transform: translateX(-260px);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: 4px 0 24px rgba(0,0,0,.18);
    }
    #sidebar.open { transform: translateX(0); }

    #sidebar-toggle {
      position: fixed; top: 16px; left: 16px; z-index: 1001;
      width: 36px; height: 36px; border-radius: 8px; border: none;
      background: #0a3c78; color: white; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transition: background .2s, left .28s cubic-bezier(.4,0,.2,1);
    }
    #sidebar-toggle:hover { background: #1e64b4; }
    #sidebar-toggle.shifted { left: 272px; }

    .toggle-bar { width: 18px; height: 2px; background: white; border-radius: 2px; transition: all .22s; }
    #sidebar-toggle.open .toggle-bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #sidebar-toggle.open .toggle-bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
    #sidebar-toggle.open .toggle-bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 999; }
    #sidebar-overlay.visible { display: block; }

    .sidebar-header { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .sidebar-home-link {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      color: white; font-weight: 700; font-size: 14px; padding: 8px 10px;
      border-radius: 7px; background: rgba(255,255,255,.08); transition: background .18s;
    }
    .sidebar-home-link:hover { background: rgba(255,255,255,.16); }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 10px; }
    .sidebar-course-link {
      display: flex; align-items: center; padding: 10px 8px 6px;
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.55); text-decoration: none;
      transition: color .18s;
    }
    .sidebar-course-link:hover { color: white; }
    .sidebar-section-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.4); padding: 10px 8px 6px;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      border-radius: 7px; text-decoration: none; color: rgba(255,255,255,.78);
      font-size: 13px; font-weight: 500; transition: background .18s, color .18s;
    }
    .sidebar-link:hover { background: rgba(255,255,255,.1); color: white; }
    .sidebar-link.active { background: rgba(59,130,212,.30); color: white; }
    .sidebar-link-num {
      width: 22px; height: 22px; border-radius: 5px; background: rgba(255,255,255,.12);
      display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .sidebar-link.active .sidebar-link-num { background: #3b82d4; }
    .sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; color: rgba(255,255,255,.3); text-align: center; }
  </style>
</head>
<body>

  <button id="sidebar-toggle" aria-label="Toggle navigation">
    <span class="toggle-bar"></span>
    <span class="toggle-bar"></span>
    <span class="toggle-bar"></span>
  </button>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <a class="sidebar-home-link" href="index.html">
        <span style="font-size:18px;line-height:1;">🏠</span>
        <span>Study Hub</span>
      </a>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">Fall '26 — Study Hub</div>
  </aside>

  <div class="container" id="app">
    <div style="padding:40px;text-align:center;color:#57606a;">Loading…</div>
  </div>

  <script>
  // ── Sidebar toggle ─────────────────────────────────────────────────────────
  (function() {
    var toggle  = document.getElementById('sidebar-toggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var open    = false;
    function openSidebar()  { open=true;  sidebar.classList.add('open');    toggle.classList.add('open','shifted');    overlay.classList.add('visible'); }
    function closeSidebar() { open=false; sidebar.classList.remove('open'); toggle.classList.remove('open','shifted'); overlay.classList.remove('visible'); }
    toggle.addEventListener('click', function() { open ? closeSidebar() : openSidebar(); });
    overlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function(e) { if (e.key==='Escape' && open) closeSidebar(); });
  })();

  // ── Module registry — add new modules here ────────────────────────────────
  var MODULES = [

  // ── Gist sync ─────────────────────────────────────────────────────────────
  // Saves per-card history keyed by module id so any device can resume exactly.
  // Shape: { "ga-history-m7": { "Who founded...": { good:3, again:1, times:[4,2] }, ... }, ... }
  var PROXY_BASE = 'https://gist-proxy.vlad-stol223.workers.dev/progress';
  var gistDirty = false;
  function gistUrl() { return PROXY_BASE + '?file=' + moduleMeta.gistFile; }
  function cpSyncProgress() { gistDirty = true; }
  async function gistFlush() {
    if (!gistDirty) return;
    gistDirty = false;
    try {
      var url = gistUrl();
      // Always fetch the latest remote first so we never clobber another module's data
      var getRes = await fetch(url, { cache: 'no-store' });
      var current = getRes.ok ? await getRes.json() : {};
      // Merge our module in: per-card take the version with more total reviews
      var existing = current[MOD.id] || {};
      Object.keys(cardHistory).forEach(function(q) {
        var l = cardHistory[q], r = existing[q];
        if (!r || (l.good + l.again) >= (r.good + r.again)) existing[q] = l;
      });
      current[MOD.id] = existing;
      await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(current) });
    } catch(e) { gistDirty = true; }
  }
  async function gistLoad() {
    try {
      var res = await fetch(gistUrl(), { cache: 'no-store' });
      if (!res.ok) return;
      var data = await res.json();
      var remote = data[MOD.id];
      if (!remote) return;
      // Merge: for each card take the version with more total reviews
      var changed = false;
      Object.keys(remote).forEach(function(q) {
        var r = remote[q];
        var l = cardHistory[q];
        if (!l || (r.good + r.again) > (l.good + l.again)) {
          cardHistory[q] = r;
          changed = true;
        }
      });
      if (!changed) return;
      recomputeAnkiStats();
      saveLocalStorage();
      updateStats();
    } catch(e) {}
  }
  setInterval(gistFlush, 30000);
  window.addEventListener('pagehide', gistFlush);

    document.getElementById('tts-stop-btn').addEventListener('click', stopSpeech);
    document.getElementById('tts-pause-btn').addEventListener('click', function() {
      if (ttsActiveBtn) toggleSectionSpeech(ttsActiveBtn);
    });
    var readingToggleBtn = document.getElementById('reading-toggle-btn');
    if (readingToggleBtn) {
      readingToggleBtn.addEventListener('click', function() {
        var open = document.body.classList.toggle('reading-open');
        this.classList.toggle('active', open);
        // If a section is already active when panel opens, scroll to it
        if (open) {
          var activeSec = document.querySelector('.learn-section-body.open');
          if (activeSec) {
            var wrap = activeSec.parentElement;
            var idx = wrap ? parseInt(wrap.dataset.learnIdx) : NaN;
            if (!isNaN(idx)) {
              // give the CSS transition a moment to open the panel first
              setTimeout(function(){ setActiveReadingSection(idx); }, 320);
            }
          }
        }
      });
    }
    document.getElementById('anki-front').addEventListener('mousedown', handleAnkiClick);
    addSwipeHandlers(document.getElementById('anki-front'));
    document.getElementById('analytics-btn').addEventListener('click', showAnalytics);
    document.getElementById('reset-btn').addEventListener('click', resetAnkiStats);
    document.getElementById('close-analytics-btn').addEventListener('click', closeAnalytics);
    document.getElementById('analytics-overlay').addEventListener('mousedown', function(e){ if (e.target===this) closeAnalytics(); });
    document.getElementById('go-anki-btn').addEventListener('click', function(){ switchTab('anki'); });

    // TTS voices
    if (window.speechSynthesis) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    // Load local progress, then pull Gist in background and merge
    loadLocalStorage();
    gistLoad();
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab-pane').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById(name).classList.add('active');
    document.querySelector('[data-tab="'+name+'"]').classList.add('active');
    if (name === 'anki' && !ankiSessionActive) startAnkiSession();
  }

  // ── Anki ──────────────────────────────────────────────────────────────────
  // Weighted shuffle: key cards get 2 slots, normal cards get 1
  function buildWeightedQueue(deck) {
    var keys    = deck.filter(function(c){ return c.key; });
    var normal  = deck.filter(function(c){ return !c.key; });
    var pool = keys.concat(keys).concat(normal); // key cards appear twice
    // Fisher-Yates shuffle
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool;
  }

  function startAnkiSession() {
    ankiSessionActive = true;
    // Filter out cards already mastered (good > again from history) so they
    // don't keep pulling down accuracy in new sessions. If everything is
    // mastered, study all cards again.
    var due = ankiCards.filter(function(c) {
      var h = cardHistory[c.question];
      if (!h) return true;                 // never seen → include
      return h.good <= h.again;            // net-negative or tied → include
    });
    if (!due.length) due = ankiCards;      // full reset when everything mastered
    sessionQueue = buildWeightedQueue(due);
    showNextAnkiCard();
  }
  function showNextAnkiCard() {
    if (!sessionQueue.length) { endAnkiSession(); return; }
    currentAnkiCard = sessionQueue[0];
    ankiFrontShowing = true;
    cardShownAt = Date.now();
    displayAnkiCard(true); // true = play enter animation
  }
  function displayAnkiCard(enterAnim) {
    document.getElementById('anki-front-text').textContent =
      ankiFrontShowing ? currentAnkiCard.question : currentAnkiCard.answer;
    // Amber tint for key cards
    var card = document.getElementById('anki-front');
    if (ankiFrontShowing) card.classList.remove('anki-back');
    if (currentAnkiCard.key) {
      card.style.borderColor = '#f59e0b';
      card.style.background  = '#fffbeb';
    } else {
      card.style.borderColor = '';
      card.style.background  = '';
    }
    if (enterAnim) {
      card.classList.remove('anim-enter');
      void card.offsetWidth; // reflow to restart animation
      card.classList.add('anim-enter');
      card.addEventListener('animationend', function h(){ card.classList.remove('anim-enter'); card.removeEventListener('animationend', h); });
    }
  }
  function ankiFlipReveal() {
    var card = document.getElementById('anki-front');
    card.classList.remove('anim-flip');
    void card.offsetWidth;
    card.classList.add('anim-flip');
    card.addEventListener('animationend', function h(){ card.classList.remove('anim-flip'); card.removeEventListener('animationend', h); });
    ankiFrontShowing = false;
    card.classList.add('anki-back');
    displayAnkiCard();
  }
  function handleAnkiClick(e) {
    e.preventDefault();
    if (!ankiFrontShowing) {
      if (e.button === 0) {
        var card = document.getElementById('anki-front');
        var rect = card.getBoundingClientRect();
        var midX = rect.left + rect.width / 2;
        if (e.clientX < midX) {
          flashCard(card, 'flash-again');
          markAnkiAgain();
        } else {
          flashCard(card, 'flash-good');
          markAnkiGood();
        }
      }
    } else {
      if (e.button === 0) ankiFlipReveal();
    }
  }
  function recordTime() {
    if (!currentAnkiCard || !cardShownAt) return;
    var elapsed = Date.now() - cardShownAt;
    if (elapsed > 0 && elapsed <= MAX_RESPONSE_MS) {
      var key = currentAnkiCard.question;
      if (!cardHistory[key]) cardHistory[key] = { good:0, again:0, times:[] };
      cardHistory[key].times.push(Math.round(elapsed/1000));
    }
  }
  function markAnkiGood() {
    if (!currentAnkiCard) return;
    recordTime();
    var key = currentAnkiCard.question;
    if (!cardHistory[key]) cardHistory[key] = { good:0, again:0, times:[] };
    cardHistory[key].good++;
    sessionQueue.shift();
    ankiStats.totalReviewed++; ankiStats.goodCount++;
    if (currentAnkiCard.key) { ankiStats.keyReviewed++; ankiStats.keyGood++; }
    saveLocalStorage(); updateStats();
    ankiExitThen('anim-exit-right', showNextAnkiCard);
  }
  function markAnkiAgain() {
    if (!currentAnkiCard) return;
    recordTime();
    var key = currentAnkiCard.question;
    if (!cardHistory[key]) cardHistory[key] = { good:0, again:0, times:[] };
    cardHistory[key].again++;
    sessionQueue.push(sessionQueue.shift());
    ankiStats.totalReviewed++; ankiStats.againCount++;
    if (currentAnkiCard.key) { ankiStats.keyReviewed++; ankiStats.keyAgain++; }
    saveLocalStorage(); updateStats();
    ankiExitThen('anim-exit-left', showNextAnkiCard);
  }
  function ankiExitThen(cls, cb) {
    var card = document.getElementById('anki-front');
    card.classList.remove('anim-exit-left', 'anim-exit-right');
    void card.offsetWidth;
    card.classList.add(cls);
    card.addEventListener('animationend', function h(){
      card.classList.remove(cls);
      card.removeEventListener('animationend', h);
      cb();
    });
  }
  function updateStats() {
    // Unique-card counts: good = ever marked good; again = seen but never good yet
    var totalCards    = ankiCards.length;
    var totalKeyCards = ankiCards.filter(function(c){ return c.key; }).length;
    var uniqueGood    = ankiCards.filter(function(c){ var h = cardHistory[c.question]; return h && h.good > 0; }).length;
    var uniqueAgain   = ankiCards.filter(function(c){ var h = cardHistory[c.question]; return h && h.again > 0 && h.good === 0; }).length;
    var uniqueKeyGood  = ankiCards.filter(function(c){ return c.key && cardHistory[c.question] && cardHistory[c.question].good > 0; }).length;
    var uniqueKeyAgain = ankiCards.filter(function(c){ return c.key && cardHistory[c.question] && cardHistory[c.question].again > 0 && cardHistory[c.question].good === 0; }).length;
    var pr = totalCards    > 0 ? Math.round(uniqueGood    / totalCards    * 100) : 0;
    var kr = totalKeyCards > 0 ? Math.round(uniqueKeyGood / totalKeyCards * 100) : 0;

    // Rings
    var outerCirc = 2 * Math.PI * 44; // 276.46
    var innerCirc = 2 * Math.PI * 29; // 182.21
    var outerEl = document.getElementById('ring-outer');
    var innerEl = document.getElementById('ring-inner');
    var centerEl = document.getElementById('ring-center-top');
    if (outerEl) outerEl.setAttribute('stroke-dashoffset', (outerCirc * (1 - pr/100)).toFixed(2));
    if (innerEl) innerEl.setAttribute('stroke-dashoffset', (innerCirc * (1 - kr/100)).toFixed(2));
    if (centerEl) centerEl.textContent = pr + '%';

    // Legend
    var lt  = document.getElementById('legend-total');
    var lga = document.getElementById('legend-good-again');
    var lkr = document.getElementById('legend-key-rate');
    var lkg = document.getElementById('legend-key-good-again');
    var uniqueSeen = Object.keys(cardHistory).length;
    if (lt)  lt.textContent  = uniqueSeen + ' / ' + ankiCards.length;
    if (lga) lga.textContent = uniqueGood + ' / ' + uniqueAgain;
    if (lkr) lkr.textContent = kr + '%';
    if (lkg) lkg.textContent = uniqueKeyGood + ' / ' + uniqueKeyAgain;
  }
  function endAnkiSession() {
    ankiSessionActive = false;
    var uGood  = ankiCards.filter(function(c){ var h = cardHistory[c.question]; return h && h.good > 0; }).length;
    var uAgain = ankiCards.filter(function(c){ var h = cardHistory[c.question]; return h && h.again > 0 && h.good === 0; }).length;
    document.getElementById('anki-front-text').innerHTML =
      '<div class="session-complete">' +
        '<h3>✓ All cards correct!</h3>' +
        '<p>Cards seen: ' + Object.keys(cardHistory).length + ' / ' + ankiCards.length + '</p>' +
        '<p>Good: ' + uGood + ' | Again: ' + uAgain + '</p>' +
        '<p style="margin-top:16px;"><button class="anki-btn anki-btn-primary" id="study-again-btn">Study Again</button></p>' +
      '</div>';
    document.getElementById('study-again-btn').addEventListener('click', startAnkiSession);
  }
  function resetAnkiStats() {
    if (!confirm('Reset all Anki stats and history? This cannot be undone.')) return;
    ankiStats = { totalReviewed:0, goodCount:0, againCount:0, keyReviewed:0, keyGood:0, keyAgain:0 };
    cardHistory = {};
    localStorage.removeItem(sKey('cardHistory'));
    // Push the cleared state to the gist so other devices don't restore old data
    gistDirty = true;
    gistFlush();
    updateStats();
    ankiSessionActive = false;
    startAnkiSession();
  }
  function saveLocalStorage() {
    localStorage.setItem(sKey('cardHistory'), JSON.stringify(cardHistory));
    cpSyncProgress();
  }
  function recomputeAnkiStats() {
    var totGood = 0, totAgain = 0, keyGood = 0, keyAgain = 0;
    var keyQuestions = new Set(ankiCards.filter(function(c){ return c.key; }).map(function(c){ return c.question; }));
    Object.keys(cardHistory).forEach(function(q) {
      var h = cardHistory[q];
      totGood  += h.good;
      totAgain += h.again;
      if (keyQuestions.has(q)) { keyGood += h.good; keyAgain += h.again; }
    });
    ankiStats.goodCount     = totGood;
    ankiStats.againCount    = totAgain;
    ankiStats.totalReviewed = totGood + totAgain;
    ankiStats.keyGood       = keyGood;
    ankiStats.keyAgain      = keyAgain;
    ankiStats.keyReviewed   = keyGood + keyAgain;
  }
  function loadLocalStorage() {
    var h2 = localStorage.getItem(sKey('cardHistory'));
    if (h2) cardHistory = JSON.parse(h2);
    // Always recompute ankiStats from cardHistory — the saved ankiStats object
    // can diverge from cardHistory (e.g. after a gist merge on another device).
    recomputeAnkiStats();
    updateStats();
  }

  // ── Analytics ─────────────────────────────────────────────────────────────
  function showAnalytics() {
    var body = document.getElementById('analytics-body');
    var totalCards = ankiCards.length;
    var uniqueGood = ankiCards.filter(function(c){ var h = cardHistory[c.question]; return h && h.good > 0; }).length;
    var pr = totalCards > 0 ? Math.round(uniqueGood / totalCards * 100) : 0;
    var cardData = ankiCards.map(function(c) {
      var hh = cardHistory[c.question] || { good:0, again:0, times:[] };
      var total = hh.good + hh.again;
      var avgTime = hh.times.length > 0 ? (hh.times.reduce(function(a,b){return a+b;},0)/hh.times.length).toFixed(1) : null;
      var diff = total > 0 ? hh.again/total : 0;
      return { question:c.question, good:hh.good, again:hh.again, total:total, avgTime:avgTime, difficulty:diff };
    });
    var hardest = cardData.filter(function(c){return c.total>0;}).sort(function(a,b){return b.difficulty-a.difficulty;}).slice(0,5);
    var allTimes = Object.values(cardHistory).reduce(function(acc,h2){return acc.concat(h2.times);}, []);
    var overallAvg = allTimes.length > 0 ? (allTimes.reduce(function(a,b){return a+b;},0)/allTimes.length).toFixed(1) : null;
    var neverReviewed = cardData.filter(function(c){return c.total===0;}).length;
    var mastered = cardData.filter(function(c){return c.total>0&&c.difficulty===0;}).length;

    function statBox(val,lbl,col) {
      return '<div style="background:#f7f8fa;border:1px solid #e5e7eb;border-radius:6px;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:600;color:'+col+';">'+val+'</div><div style="font-size:11px;color:#57606a;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;">'+lbl+'</div></div>';
    }
    function diffBar(d) {
      var pct = Math.round(d*100);
      var col = pct>=60?'#dc2626':pct>=30?'#d97706':'#16a34a';
      return '<div style="display:flex;align-items:center;gap:8px;"><div style="flex:1;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:4px;"></div></div><span style="font-size:12px;color:'+col+';font-weight:600;min-width:32px;">'+pct+'%</span></div>';
    }
    function rows(arr, size) {
      return arr.map(function(c){
        return '<tr style="border-top:1px solid #e5e7eb;">' +
          '<td style="padding:9px 8px;font-size:'+size+'px;color:#1f2328;max-width:280px;">'+c.question+'</td>' +
          '<td style="padding:9px 8px;text-align:center;font-size:'+size+'px;color:#16a34a;font-weight:600;">'+c.good+'</td>' +
          '<td style="padding:9px 8px;text-align:center;font-size:'+size+'px;color:#dc2626;font-weight:600;">'+c.again+'</td>' +
          '<td style="padding:9px 8px;min-width:110px;">'+(c.total>0?diffBar(c.difficulty):'<span style="font-size:11px;color:#aaa;">not seen</span>')+'</td>' +
          '<td style="padding:9px 8px;text-align:center;font-size:'+size+'px;color:#57606a;">'+(c.avgTime!==null?c.avgTime+'s':'—')+'</td>' +
          '</tr>';
      }).join('');
    }
    var th = '<tr style="background:#f7f8fa;"><th style="padding:8px;text-align:left;font-size:11px;color:#57606a;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Question</th><th style="padding:8px;text-align:center;font-size:11px;color:#57606a;font-weight:600;">Good</th><th style="padding:8px;text-align:center;font-size:11px;color:#57606a;font-weight:600;">Again</th><th style="padding:8px;font-size:11px;color:#57606a;font-weight:600;">Difficulty</th><th style="padding:8px;text-align:center;font-size:11px;color:#57606a;font-weight:600;">Avg Time</th></tr>';
    body.innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;">' +
        statBox(tr,'Total Reviews','#0a3c78') +
        statBox(pr+'%','Pass Rate',pr>=80?'#16a34a':pr>=50?'#d97706':'#dc2626') +
        statBox(overallAvg!==null?overallAvg+'s':'—','Avg Response','#7c5cd8') +
        statBox(mastered+'/'+ankiCards.length,'Mastered','#16a34a') +
      '</div>' +
      '<h3 style="color:#0a3c78;font-size:14px;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">Hardest Cards</h3>' +
      '<div style="overflow-x:auto;margin-bottom:24px;"><table style="width:100%;border-collapse:collapse;"><thead>'+th+'</thead><tbody>' +
        (hardest.length ? rows(hardest,13) : '<tr><td colspan="5" style="padding:16px;text-align:center;color:#57606a;font-size:13px;">No cards reviewed yet.</td></tr>') +
      '</tbody></table></div>' +
      '<h3 style="color:#0a3c78;font-size:14px;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">All Cards</h3>' +
      '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead>'+th+'</thead><tbody>' +
        rows(cardData.slice().sort(function(a,b){return b.difficulty-a.difficulty||b.again-a.again;}), 12) +
      '</tbody></table></div>' +
      (neverReviewed > 0 ? '<p style="margin-top:14px;font-size:12px;color:#57606a;">'+neverReviewed+' card'+(neverReviewed>1?'s':'')+' not yet seen this session.</p>' : '');
    document.getElementById('analytics-overlay').style.display = 'block';
  }
  function closeAnalytics() { document.getElementById('analytics-overlay').style.display = 'none'; }

  // ── Mobile swipe + tap-to-flip ────────────────────────────────────────────
  function flashCard(el, cls) {
    el.classList.add(cls);
    setTimeout(function() { el.classList.remove(cls); }, 320);
  }
  function addSwipeHandlers(el) {
    var startX = 0, startY = 0, moved = false;
    el.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      moved  = false;
    }, { passive: true });
    el.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientX - startX) > 8) moved = true;
    }, { passive: true });
    el.addEventListener('touchend', function(e) {
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        // horizontal swipe
        if (dx < 0) { flashCard(el, 'flash-again'); markAnkiAgain(); }
        else        { flashCard(el, 'flash-good');  markAnkiGood();  }
      } else if (!moved) {
        // tap — flip card
        handleAnkiClick({ button: 0 });
      }
    }, { passive: true });
  }

  // ── TTS ───────────────────────────────────────────────────────────────────
  var ttsActiveBtn = null, ttsVoices = [], ttsPaused = false, ttsCurrentUtt = null;
  var ttsCursorNode = null; // live <span class="tts-cursor"> in the DOM

  function ttsShowControls(show) {
    var s = document.getElementById('tts-stop-btn');
    var p = document.getElementById('tts-pause-btn');
    if (s) s.style.display = show ? 'inline-block' : 'none';
    if (p) p.style.display = show ? 'inline-block' : 'none';
  }

  function ttsRemoveCursor() {
    if (ttsCursorNode && ttsCursorNode.parentNode) {
      // replace the <span.tts-cursor> with its text content in place
      ttsCursorNode.parentNode.replaceChild(
        document.createTextNode(ttsCursorNode.textContent),
        ttsCursorNode
      );
    }
    ttsCursorNode = null;
  }

  // Build a flat list of all text nodes inside el, and a char-offset map
  // so we can place the cursor span at a given charIndex within el.innerText
  function ttsPlaceCursor(el, charIndex) {
    ttsRemoveCursor();
    var offset = 0;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while ((node = walker.nextNode())) {
      var len = node.nodeValue.length;
      if (offset + len > charIndex) {
        // cursor lands inside this text node
        var localIdx = charIndex - offset;
        // find end of word
        var wordEnd = localIdx;
        while (wordEnd < len && !/\s/.test(node.nodeValue[wordEnd])) wordEnd++;
        if (wordEnd === localIdx) { offset += len; continue; } // whitespace, skip
        var before = node.nodeValue.slice(0, localIdx);
        var word   = node.nodeValue.slice(localIdx, wordEnd);
        var after  = node.nodeValue.slice(wordEnd);
        var span   = document.createElement('span');
        span.className = 'tts-cursor';
        span.textContent = word;
        var parent = node.parentNode;
        var next   = node.nextSibling;
        parent.removeChild(node);
        if (before) parent.insertBefore(document.createTextNode(before), next);
        parent.insertBefore(span, next || null);
        if (after) parent.insertBefore(document.createTextNode(after), span.nextSibling);
        ttsCursorNode = span;
        // scroll into view softly
        span.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }
      offset += len;
    }
  }

  function populateVoices() {
    ttsVoices = window.speechSynthesis.getVoices();
    var select = document.getElementById('tts-voice-select');
    if (!select || !ttsVoices.length) return;
    var preferred = ['Google UK English Female','Google UK English Male','Google US English','Samantha','Karen','Moira','Victoria','Daniel','Oliver','Microsoft Aria','Microsoft Jenny','Microsoft Guy'];
    var english = ttsVoices.filter(function(v){return v.lang.startsWith('en');});
    var others  = ttsVoices.filter(function(v){return !v.lang.startsWith('en');});
    var score   = function(v){ var i=preferred.findIndex(function(p){return v.name.includes(p);}); return i===-1?999:i; };
    english.sort(function(a,b){return score(a)-score(b);});
    var sorted = english.concat(others);
    select._sorted = sorted;
    var savedName = localStorage.getItem('ttsVoiceName');
    var targetName = savedName || 'Google UK English Female';
    select.innerHTML = '';
    var selectedIdx = 0;
    sorted.forEach(function(v,i){
      var opt = document.createElement('option');
      opt.value = i; opt.textContent = v.name+' ('+v.lang+')';
      select.appendChild(opt);
      if (v.name === targetName) selectedIdx = i;
    });
    select.value = selectedIdx;
  }
  function getSelectedVoice() {
    var select = document.getElementById('tts-voice-select');
    if (!select||!select._sorted) return null;
    var voice = select._sorted[parseInt(select.value)]||null;
    if (voice) localStorage.setItem('ttsVoiceName', voice.name);
    return voice;
  }
  function getSelectedRate() {
    var sel = document.getElementById('tts-rate-select');
    return sel ? parseFloat(sel.value) : 0.95;
  }
  function getSectionText(btn) {
    var section = btn.closest('.learn-section');
    var header  = section.querySelector('.learn-section-header');
    var body    = section.querySelector('.learn-section-body');
    var titleSpan = header ? header.querySelector('span:first-child') : null;
    var rawTitle  = titleSpan ? titleSpan.textContent.trim() : '';
    var match = rawTitle.match(/^(\d+)\s*[—\-]\s*(.+)$/);
    var sectionNum  = match ? match[1] : '';
    var sectionName = match ? match[2].replace(/&amp;/g,'and').replace(/&/g,'and') : rawTitle;
    var bodyText = body ? body.innerText.trim() : '';
    var intro = sectionNum ? 'Section '+sectionNum+'. '+sectionName+'.' : (sectionName ? sectionName+'.' : '');
    return [intro, bodyText, 'Moving on.'].filter(Boolean).join('  ');
  }
  function toggleSectionSpeech(btn) {
    // ── Pause / resume of the same section ───────────────────────────────────
    if (ttsActiveBtn === btn) {
      if (ttsPaused) {
        window.speechSynthesis.resume();
        ttsPaused = false;
        btn.textContent = '⏸';
        btn.classList.remove('tts-paused');
        btn.classList.add('tts-active');
        var pb = document.getElementById('tts-pause-btn');
        if (pb) pb.textContent = '⏸ Pause';
      } else {
        window.speechSynthesis.pause();
        ttsPaused = true;
        btn.textContent = '▶';
        btn.classList.remove('tts-active');
        btn.classList.add('tts-paused');
        var pb = document.getElementById('tts-pause-btn');
        if (pb) pb.textContent = '▶ Resume';
      }
      return;
    }
    // ── Start a new section ──────────────────────────────────────────────────
    stopSpeech();
    var text = getSectionText(btn);
    if (!text || !window.speechSynthesis) return;
    var hdr  = btn.closest('.learn-section-header');
    var body = hdr.nextElementSibling;
    if (!body.classList.contains('open')) { body.classList.add('open'); hdr.classList.add('open'); }

    // Sync reading panel to this section
    var section  = btn.closest('.learn-section');
    var learnIdx = section.dataset.learnIdx !== undefined ? parseInt(section.dataset.learnIdx) : null;
    if (learnIdx !== null) setActiveReadingSection(learnIdx);

    // Compute intro length so boundary charIndex is offset into body text
    var titleSpan = hdr.querySelector('span:first-child');
    var rawTitle  = titleSpan ? titleSpan.textContent.trim() : '';
    var match     = rawTitle.match(/^(\d+)\s*[—\-]\s*(.+)$/);
    var sectionNum  = match ? match[1] : '';
    var sectionName = match ? match[2].replace(/&amp;/g,'and').replace(/&/g,'and') : rawTitle;
    var intro = sectionNum ? 'Section '+sectionNum+'. '+sectionName+'.' : (sectionName ? sectionName+'.' : '');
    var introLen = intro ? intro.length + 2 : 0; // +2 for the two spaces separator

    var utt = new SpeechSynthesisUtterance(text);
    utt.rate = getSelectedRate(); utt.pitch = 1;
    var voice = getSelectedVoice();
    if (voice) utt.voice = voice;
    ttsCurrentUtt = utt;
    ttsPaused = false;

    utt.onstart = function() {
      ttsActiveBtn = btn;
      btn.textContent = '⏸';
      btn.classList.add('tts-active');
      ttsShowControls(true);
    };
    utt.onboundary = function(e) {
      if (e.name !== 'word') return;
      var bodyCharIdx = e.charIndex - introLen;
      if (bodyCharIdx >= 0) ttsPlaceCursor(body, bodyCharIdx);
    };
    utt.onend = function() {
      ttsRemoveCursor();
      resetTtsBtn(btn);
      var nextSection = btn.closest('.learn-section').nextElementSibling;
      if (nextSection && nextSection.classList.contains('learn-section')) {
        var nextBtn = nextSection.querySelector('.tts-btn');
        if (nextBtn) toggleSectionSpeech(nextBtn);
      }
    };
    utt.onerror = function() { ttsRemoveCursor(); resetTtsBtn(btn); };
    window.speechSynthesis.speak(utt);
  }
  function stopSpeech() {
    ttsRemoveCursor();
    window.speechSynthesis.cancel();
    ttsPaused = false;
    ttsCurrentUtt = null;
    if (ttsActiveBtn) resetTtsBtn(ttsActiveBtn);
    ttsShowControls(false);
  }
  function resetTtsBtn(btn) {
    btn.textContent = '🔊';
    btn.classList.remove('tts-active', 'tts-paused');
    ttsActiveBtn = null;
    ttsPaused = false;
  }
  function toggleLearnSection(hdr, body) {
    var isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    hdr.classList.toggle('open', !isOpen);
    // Typeset any LaTeX in this section body on first open
    if (!isOpen && window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([body]).catch(function(){});
    }
  }

  // ── Reading panel sync ────────────────────────────────────────────────────
  function setActiveReadingSection(learnIdx) {
    var panel = document.getElementById('reading-panel');
    if (!panel) return;
    var paras = panel.querySelectorAll('.reading-para');
    if (learnIdx === null || learnIdx === undefined) {
      // clear all highlights
      panel.classList.remove('has-active');
      paras.forEach(function(p) { p.classList.remove('reading-para-active', 'reading-para-active-first'); });
      return;
    }
    panel.classList.add('has-active');
    var firstActive = null;
    paras.forEach(function(p) {
      p.classList.remove('reading-para-active', 'reading-para-active-first');
      if (parseInt(p.dataset.learnRef) === learnIdx) {
        p.classList.add('reading-para-active');
        if (!firstActive) firstActive = p;
      }
    });
    if (firstActive) {
      firstActive.classList.add('reading-para-active-first');
      // Scroll the panel's inner scroller to the first active paragraph
      if (document.body.classList.contains('reading-open')) {
        var inner = firstActive.closest('.reading-panel-inner');
        if (inner) {
          // offset relative to inner's scroll container
          var paraTop = firstActive.offsetTop - (inner.querySelector('.reading-panel-header').offsetHeight || 0) - 12;
          inner.scrollTo({ top: paraTop, behavior: 'smooth' });
        }
      }
    }
  }

  // ── Boot: fetch JSON and mount ─────────────────────────────────────────────
  fetch(moduleMeta.file)
    .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(mount)
    .catch(function(err){
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;text-align:center;color:#dc2626;">Failed to load module data.<br><small>'+err+'</small></div>';
    });
  </script>
</body>
</html>
